version: 2

project_name: hauler
before:
  hooks:
    - go mod tidy
    - go mod download
    - go fmt ./...
    - go vet ./...
    - go test ./... -cover -race -covermode=atomic -coverprofile=coverage.out
    - sh -c 'mkdir -p completions && for s in bash zsh fish; do go run ./cmd/hauler completion "$s" > "completions/hauler.$s"; done'

release:
  prerelease: auto
  make_latest: false

env:
  - vpkg=hauler.dev/go/hauler/v2/internal/version

builds:
  - dir: ./cmd/hauler/.
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X {{ .Env.vpkg }}.gitVersion={{ .Version }} -X {{ .Env.vpkg }}.gitCommit={{ .ShortCommit }} -X {{ .Env.vpkg }}.gitTreeState={{if .IsGitDirty}}dirty{{else}}clean{{end}} -X {{ .Env.vpkg }}.buildDate={{ .Date }}
    env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=boringcrypto

universal_binaries:
  - replace: false

changelog:
  disable: false
  use: git

nfpms:
  - package_name: hauler
    vendor: hauler-dev
    homepage: https://hauler.dev
    maintainer: hauler-dev <hauler@hauler.dev>
    description: "Hauler: Airgap Swiss Army Knife"
    license: Apache-2.0
    section: utils
    formats:
      - deb
      - rpm
      - apk
      - ipk
      - archlinux
      - msix
    bindir: /usr/bin
    contents:
      - src: completions/hauler.bash
        dst: /usr/share/bash-completion/completions/hauler
      - src: completions/hauler.zsh
        dst: /usr/share/zsh/site-functions/_hauler
      - src: completions/hauler.fish
        dst: /usr/share/fish/vendor_completions.d/hauler.fish
      - src: LICENSE
        dst: /usr/share/licenses/hauler/LICENSE
      - src: README.md
        dst: /usr/share/doc/hauler/README.md
    archlinux:
      packager: hauler-dev
    msix:
      publisher: "CN=hauler-dev"
      properties:
        display_name: Hauler
        publisher_display_name: hauler-dev
        logo: static/rgs-hauler-logo-icon.png
      applications:
        - id: hauler
          executable: hauler.exe
    overrides:
      msix:
        contents:
          - src: static/rgs-hauler-logo-icon.png
            dst: static/rgs-hauler-logo-icon.png

homebrew_casks:
  - name: hauler
    repository:
      owner: hauler-dev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      branch: "hauler-{{ .Tag }}"
      pull_request:
        enabled: true
        base:
          branch: main
    description: "Hauler: Airgap Swiss Army Knife"
    skip_upload: auto
    conflicts:
      - cask: hauler-dev
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/hauler"]
          end

  - name: hauler-dev
    repository:
      owner: hauler-dev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      branch: "hauler-{{ .Tag }}"
      pull_request:
        enabled: true
        base:
          branch: main
    description: "Hauler: Airgap Swiss Army Knife (release candidates and dev builds)"
    binaries:
      - hauler
    conflicts:
      - cask: hauler
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/hauler"]
          end

  - name: "hauler@{{ .Version }}"
    repository:
      owner: hauler-dev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      branch: "hauler-{{ .Tag }}"
      pull_request:
        enabled: true
        base:
          branch: main
    description: "Hauler: Airgap Swiss Army Knife"
    binaries:
      - hauler
    conflicts:
      - cask: hauler
      - cask: hauler-dev
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/hauler"]
          end

dockers_v2:
  - id: hauler
    dockerfile: Dockerfile
    flags:
      - "--target=release"
    images:
      - docker.io/hauler/hauler
      - ghcr.io/hauler-dev/hauler
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "classification": "UNCLASSIFIED"
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.description": "Hauler: Airgap Swiss Army Knife"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
      "org.opencontainers.image.version": "{{.Version}}"

  - id: hauler-debug
    dockerfile: Dockerfile
    flags:
      - "--target=debug"
    images:
      - docker.io/hauler/hauler-debug
      - ghcr.io/hauler-dev/hauler-debug
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "classification": "UNCLASSIFIED"
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.description": "Hauler: Airgap Swiss Army Knife"
      "org.opencontainers.image.name": "{{.ProjectName}}-debug"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
      "org.opencontainers.image.version": "{{.Version}}"
